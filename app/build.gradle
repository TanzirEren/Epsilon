plugins {
    id 'com.android.application'
}

android {
    namespace 'com.epsilon.fix.modz'
    compileSdk 34

    defaultConfig {
        applicationId "com.epsilon.fix.modz"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            storeFile file('epsilon.keystore')
            storePassword 'epsilon123'
            keyAlias 'epsilon'
            keyPassword 'epsilon123'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
